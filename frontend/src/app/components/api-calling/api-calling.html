<main class="d-flex w-100  align-content-center">
  <div class="row">
    <div class="col-auto">
      <button (click)="callApi()" class="btn btn-primary w-100">Chiama L'api</button>
    </div>
    <div class="col-auto">
      @for (item of (resultapi()); track $index) {
          <pre class="m-2 border-1 border-black">
            {{item | json}}
          </pre>
      }


    </div>
  </div>
</main>
