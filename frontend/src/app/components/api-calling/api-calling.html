<main class="d-flex w-100 align-content-center">
  <div class="col-auto m-4">
    <h3>Add new </h3>

    <form [formGroup]="addNewForm">
      <div class="input-group p-2">
        <span class="input-group-text" id="basic-addon1">Originale</span>
        <input
          type="text"
          class="form-control"
          placeholder="Url Originale"
          formControlName="original"
        />
      </div>

      <div class="input-group p-2">
        <span class="input-group-text" id="basic-addon1">Shortned</span>
        <input
          type="text"
          class="form-control"
          placeholder="Url Shortned "
          formControlName="short"
        />
      </div>
    </form>
    <button (click)="addNewUrl()" class="btn btn-primary w-100">Aggingi un nuovo url</button>
  </div>

  <hr />

  <div class="row">
    <h1 class="col-12">Tutti i risultati</h1>
    <div class="col-12 row">
      @for (item of resultapi(); track $index) {
        <!-- <pre class="m-2 border-1 border-black">
            {{ item | json }}
          </pre> -->

        <div class="card m-3 col-3">
          <div class="card-body  p-2 m-2">
            <h4 class="card-title">{{ item.code }}</h4>
            <p class="card-subtitle ">Url: {{ item.url }}</p>
            <p class="card-subtitle">Click: {{ item.clicks }}</p>
            <button (click)="deleteUrl(item.id)" class="btn btn-danger w-100">
              Elimina l'url
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</main>
